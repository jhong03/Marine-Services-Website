name: Deploy static site to Cloudflare Pages

# Builds the pre-rendered static site and deploys it to Cloudflare Pages on
# every push to main (or run manually from the Actions tab). No PHP runs on
# Cloudflare — the whole static site is generated here in CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies
        # npm install (not ci): package-lock.json is generated on Windows and
        # can't contain the Linux-only optional deps (Tailwind v4 oxide ->
        # @emnapi/*), which makes npm ci's strict cross-platform check fail.
        run: npm install

      - name: Prepare Laravel (env, key, seeded SQLite)
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force --seed

      - name: Build static site (./dist)
        run: bash scripts/build-static.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=veritas-industrial
