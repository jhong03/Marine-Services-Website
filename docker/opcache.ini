; Production OPcache tuning for the Marine Services app.
; Compiled bytecode is cached in shared memory and (with validate_timestamps=0)
; never re-checked against the source — safe because the image is immutable.
; JIT is intentionally left off: it adds little for a CRUD/Inertia workload and
; carries a small crash risk on FrankenPHP's thread-safe (ZTS) PHP build.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
